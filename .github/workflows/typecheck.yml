name: typecheck

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Typecheck Core and CLI
        run: bun --cwd packages/railwise typecheck

      - name: Typecheck JavaScript SDK
        run: bun --cwd packages/sdk/js typecheck
