name: publish
run-name: "${{ format('release {0}', inputs.bump || 'snapshot') }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build:
    if: github.repository == 'railwise-cn/RAILWISE-CLI'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: railwise-linux-x64
            artifact: linux-x64
          - os: ubuntu-latest
            target: railwise-linux-x64-baseline
            artifact: linux-x64-baseline
          - os: ubuntu-latest
            target: railwise-linux-x64-baseline-musl
            artifact: linux-x64-baseline-musl
          - os: ubuntu-24.04-arm
            target: railwise-linux-arm64
            artifact: linux-arm64
          - os: macos-latest
            target: railwise-darwin-arm64
            artifact: darwin-arm64
          - os: macos-14
            target: railwise-darwin-x64
            artifact: darwin-x64
          - os: macos-14
            target: railwise-darwin-x64-baseline
            artifact: darwin-x64-baseline
          - os: windows-latest
            target: railwise-windows-x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run --cwd packages/railwise script/build.ts --single --target ${{ matrix.target }}
        env:
          RAILWISE_VERSION: ${{ inputs.version || '' }}
          RAILWISE_BUMP: ${{ inputs.bump || '' }}
          RAILWISE_CHANNEL: ${{ (inputs.bump || inputs.version) && 'latest' || github.ref_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: railwise-${{ matrix.artifact }}
          path: packages/railwise/dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'railwise-cn/RAILWISE-CLI'
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - uses: actions/download-artifact@v8
        with:
          path: packages/railwise/dist
          merge-multiple: true

      - name: Resolve release version
        id: release-version
        run: |
          VERSION=$(ls packages/railwise/dist/*/package.json | head -1 | xargs cat | bun -e "console.log(JSON.parse(await Bun.stdin.text()).version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version ${VERSION}"

      - name: Pack shared packages
        run: bun ./scripts/pack-shared-packages.ts
        env:
          RAILWISE_VERSION: ${{ inputs.version || '' }}
          RAILWISE_BUMP: ${{ inputs.bump || '' }}
          RAILWISE_CHANNEL: ${{ (inputs.bump || inputs.version) && 'latest' || github.ref_name }}
          RAILWISE_RELEASE: ${{ (inputs.bump || inputs.version) && 'true' || '' }}

      - name: Check shared packages on npm
        id: shared-npm-ready
        run: |
          MISSING=()
          for package in @railwise/sdk @railwise/util @railwise/ui @railwise/app; do
            if ! npm view "$package" version >/dev/null 2>&1; then
              MISSING+=("$package")
            fi
          done
          if ((${#MISSING[@]})); then
            printf 'Shared npm publish skipped; bootstrap first: %s\n' "${MISSING[*]}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish shared packages to npm
        id: shared-npm
        if: steps.shared-npm-ready.outputs.publish == 'true'
        continue-on-error: true
        run: bun ./scripts/publish-shared-packages.ts --publish
        env:
          RAILWISE_VERSION: ${{ inputs.version || '' }}
          RAILWISE_BUMP: ${{ inputs.bump || '' }}
          RAILWISE_CHANNEL: ${{ (inputs.bump || inputs.version) && 'latest' || github.ref_name }}
          RAILWISE_RELEASE: ${{ (inputs.bump || inputs.version) && 'true' || '' }}
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ""

      - name: Report shared package npm publish failure
        if: steps.shared-npm.outcome == 'failure'
        run: echo "::warning::Shared package npm publish failed; continuing with GitHub Release tarballs."

      - name: Pack Agent Pack
        run: |
          bun run assets:extract -- --out dist/agent-pack/railwise-agent-pack --name @railwise/agent-pack --version "${{ steps.release-version.outputs.version }}" --force
          cd dist/agent-pack/railwise-agent-pack
          bun pm pack

      - name: Check Agent Pack on npm
        id: agent-pack-npm-ready
        run: |
          if npm view @railwise/agent-pack version >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Agent Pack npm publish skipped; bootstrap @railwise/agent-pack first."
          echo "publish=false" >> "$GITHUB_OUTPUT"

      - name: Publish Agent Pack to npm
        id: agent-pack-npm
        if: steps.agent-pack-npm-ready.outputs.publish == 'true'
        continue-on-error: true
        run: env -u NODE_AUTH_TOKEN -u NPM_CONFIG_USERCONFIG npm publish *.tgz --access public --tag ${{ (inputs.bump || inputs.version) && 'latest' || github.ref_name }} --provenance
        working-directory: dist/agent-pack/railwise-agent-pack
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ""

      - name: Report Agent Pack npm publish failure
        if: steps.agent-pack-npm.outcome == 'failure'
        run: echo "::warning::Agent Pack npm publish failed; continuing with GitHub Release tarball."

      - name: Publish CLI to npm
        id: cli-npm
        continue-on-error: true
        run: bun run --cwd packages/railwise script/publish.ts
        env:
          RAILWISE_VERSION: ${{ inputs.version || '' }}
          RAILWISE_BUMP: ${{ inputs.bump || '' }}
          RAILWISE_CHANNEL: ${{ (inputs.bump || inputs.version) && 'latest' || github.ref_name }}
          RAILWISE_RELEASE: ${{ (inputs.bump || inputs.version) && 'true' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_USERCONFIG: ""

      - name: Report CLI npm publish failure
        if: steps.cli-npm.outcome == 'failure'
        run: echo "::warning::CLI npm publish failed; continuing with GitHub Release assets."

      - name: Create GitHub Release
        if: inputs.bump || inputs.version
        run: |
          VERSION=$(ls packages/railwise/dist/*/package.json | head -1 | xargs cat | bun -e "console.log(JSON.parse(await Bun.stdin.text()).version)")
          ASSETS=(
            packages/railwise/dist/*.tar.gz packages/railwise/dist/*.zip \
            packages/railwise/dist/railwise/*.tgz \
            dist/agent-pack/railwise-agent-pack/*.tgz \
            dist/shared-packages/*.tgz dist/shared-packages/manifest.json
          )
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v${VERSION}" -f sha="$GITHUB_SHA" -F force=true
            gh release upload "v${VERSION}" --clobber "${ASSETS[@]}"
            gh release edit "v${VERSION}" --target "$GITHUB_SHA" --latest
            exit 0
          fi
          gh release create "v${VERSION}" --title "v${VERSION}" --target "$GITHUB_SHA" --generate-notes "${ASSETS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify npm publish
        if: inputs.bump || inputs.version
        run: |
          FAILED=()
          if [[ "${{ steps.shared-npm.outcome }}" == "failure" ]]; then
            FAILED+=("shared packages")
          fi
          if [[ "${{ steps.agent-pack-npm.outcome }}" == "failure" ]]; then
            FAILED+=("agent pack")
          fi
          if [[ "${{ steps.cli-npm.outcome }}" == "failure" ]]; then
            FAILED+=("CLI")
          fi
          if ((${#FAILED[@]})); then
            printf 'npm publish failed for: %s\n' "${FAILED[*]}"
            exit 1
          fi
