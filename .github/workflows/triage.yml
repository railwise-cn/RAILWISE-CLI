name: triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check prerequisites
        id: prerequisites
        env:
          RAILWISE_API_KEY: ${{ secrets.RAILWISE_API_KEY }}
        run: |
          if [ -z "$RAILWISE_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping issue triage because RAILWISE_API_KEY is not configured"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.prerequisites.outputs.enabled == 'true'
        uses: ./.github/actions/setup-bun

      - name: Triage issue
        if: steps.prerequisites.outputs.enabled == 'true'
        env:
          RAILWISE_API_KEY: ${{ secrets.RAILWISE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          bun --conditions=browser packages/railwise/src/index.ts run --agent triage "The following issue was just opened, triage it:

          Title: $ISSUE_TITLE

          $ISSUE_BODY"
