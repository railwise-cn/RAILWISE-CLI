name: Desktop Release

on:
  push:
    tags:
      - "desktop/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.3.0）"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
            bundles: nsis
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin
            bundles: dmg
          - os: macos-13
            target: x86_64-apple-darwin
            platform: darwin
            bundles: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build sidecar
        working-directory: packages/desktop
        run: bun run predev -- --target ${{ matrix.target }}

      - name: macOS Import Certificate
        if: matrix.platform == 'darwin'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain

      - name: Build Tauri App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        working-directory: packages/desktop
        run: bun run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.prod.conf.json

      - name: Sign Windows Installer (signtool)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:WINDOWS_CERTIFICATE) {
            throw "Missing WINDOWS_CERTIFICATE secret"
          }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "Missing WINDOWS_CERTIFICATE_PASSWORD secret"
          }
          $cert = Join-Path $env:RUNNER_TEMP "railwise-windows-signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $tool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $tool) {
            throw "signtool.exe was not found in the Windows SDK"
          }
          $dir = "packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          $files = @(Get-ChildItem -Path $dir -Filter "*.exe" -File)
          if ($files.Count -ne 1) {
            throw "Expected exactly one NSIS installer in $dir, found $($files.Count)"
          }
          foreach ($file in $files) {
            & $tool.FullName sign /f $cert /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed for $($file.Name)"
            }
            & $tool.FullName verify /pa /v $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verify failed for $($file.Name)"
            }
          }
          Remove-Item $cert -Force

      - name: Upload signed Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: railwise-desktop-${{ matrix.target }}-signed
          path: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: railwise-desktop-${{ matrix.target }}
          path: packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create draft release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/desktop
          merge-multiple: false

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="desktop/v${VERSION}"
          fi
          mapfile -t files < <({
            find dist/desktop -path "*/railwise-desktop-*-signed/*.exe" -type f
            find dist/desktop -name "*.dmg" -type f
          } | sort -u)
          if [ "${#files[@]}" -ne 3 ]; then
            printf "Expected exactly 3 public installers, found %s:\n" "${#files[@]}"
            printf "%s\n" "${files[@]}"
            exit 1
          fi
          gh release create "$TAG" \
            --title "RAILWISE Desktop ${TAG#desktop/}" \
            --notes "查看 CHANGELOG.md 了解更新内容" \
            --draft \
            --target "$GITHUB_SHA" \
            "${files[@]}"
