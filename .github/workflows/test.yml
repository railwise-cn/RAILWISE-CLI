name: test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  unit:
    name: unit (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@railwise.ai"
          git config --global user.name "railwise"

      - name: Run unit tests
        run: bun --cwd packages/railwise test

  required:
    name: test (linux)
    runs-on: ubuntu-latest
    needs:
      - unit
    if: always()
    steps:
      - name: Verify CLI test job passed
        run: |
          echo "unit=${{ needs.unit.result }}"
          test "${{ needs.unit.result }}" = "success"
