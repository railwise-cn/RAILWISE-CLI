name: Desktop Windows Internal

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Internal build label"
        required: false
        default: "1.3.0-internal"
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    name: windows / x86_64-pc-windows-msvc
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build sidecar
        working-directory: packages/desktop
        run: bun run predev -- --target x86_64-pc-windows-msvc

      - name: Build unsigned Windows installer
        working-directory: packages/desktop
        run: bun run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.prod.conf.json

      - name: Upload internal Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: railwise-desktop-windows-x64-internal-${{ inputs.version }}
          path: packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
